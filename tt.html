<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tt.css">
    <title>Date</title>
</head>
<body>

    <div class="div1">
        
        <div class="div2">
            <label for="">Day</label>
            <br>     
            <input type="text" placeholder="DD" id="in-d">
        </div>
        <div class="div2">
            <label for="">Month</label>
            <br>
            <input type="text" placeholder="MM" id="in-m">
        </div>
        <div class="div2">
            <label for="">year</label>
            <br>
            <input type="text" placeholder="YY" id="in-y">
        </div>
        
            <div class="border"></div>
            <div class="circle" onclick="show()"><img src="check.png" class="img1"></div>
        <div class="card">    
            <div class="show1">
                <span style="color: rgb(126 94 253);" id="sp-y">- -</span><span> Years</span>
            </div>
            <div class="show2">
                <span style="color: rgb(126 94 253);" id="sp-m">- -</span><span> Mon</span> 
            </div>

            <div class="show3">
                <span style="color: rgb(126 94 253);" id="sp-d">- -</span><span> Days</span> 
            </div>
            <div class="show3">
                <span style="color: rgb(126 94 253);" id="sp-h">- -</span><span> Hour</span> 
            </div>
            <div class="show3">
                <span style="color: rgb(126 94 253);" id="sp-min">- -</span><span> Min</span> 
            </div>
            <div class="show3">
                <span style="color: rgb(126 94 253);" id="sp-s">- -</span><span> sec</span> 
            </div>
        </div>    
    </div>
    
    
    
    <script src="js/tt.js"></script>
</body>
</html>
